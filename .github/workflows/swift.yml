name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test pure logic and unsaved metadata
        run: ./scripts/test.sh
      - name: Compile app without launching
        run: ./build.sh
